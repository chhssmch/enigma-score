{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo_2.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <a href="/">
                        <img src="{% static 'images/logo_2.png' %}" alt="Логотип" class="logo-img">
                    </a>
                </div>
                <div class="nav-center">
                    <a href="/">Главная</a>
                    <a href="#about">О нас</a>
                    <a href="#howorks">Как это работает</a>
                </div>
                <div class="nav-right">
                    <a href="{% url 'users:register' %}">Регистрация</a>
                    <a href="{% url 'users:login' %}">Вход</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="form-card">
                <h2 class="reglog-text">Забыли пароль?</h2>
                <h3 style="text-align: center;">Введите email, к которому привязан ваш аккаунт. <br>
                  Мы отправим ссылку для сброса пароля.</h3>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary" style="padding: 15px 40px; font-size: 14px;">Отправить ссылку</button>
                </form>
                
                <p>Вспомнили пароль? <a href="{% url 'users:login' %}" class="button-link">Вернуться к входу</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Enigma Score</p>
        </div>
    </footer>

    <script>
        document.querySelectorAll('form input, form textarea, form select').forEach(field => {
            field.classList.add('form-control');
        });
    </script>
</body>
</html>
