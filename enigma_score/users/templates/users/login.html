<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <a href="/">
                        <img src="{% static 'images/logo_2.png' %}" alt="Логотип" class="logo-img">
                    </a>
                </div>
                <div class="nav-center">
                    <a href="/">Главная</a>
                    <a href="#about">О нас</a>
                    <a href="#howorks">Как это работает</a>
                </div>
                <div class="nav-right">
                    <a href="{% url 'users:register' %}">Регистрация</a>
                    <a href="{% url 'users:login' %}">Вход</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="form-card">
                <h2 style="text-align: center;">Вход</h2>
                <br>
                

                <form method="post">
                    {% csrf_token %}
                    
                    <input type="text" name="username" placeholder="Имя пользователя" class="form-control" required>
                    <input type="password" name="password" placeholder="Пароль" class="form-control" required>
                    
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                
                <p>Нет аккаунта? <a href="{% url 'users:register' %}" class="button-link">Зарегистрироваться</a></p>
                <br>
                <p>Забыли пароль? <a href="{% url 'users:password_reset' %}" class="button-link">Сбросить</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Enigma Score</p>
        </div>
    </footer>
</body>
</html>
